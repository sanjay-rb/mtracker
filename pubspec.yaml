name: mtracker
version: 1.0.0+1
publish_to: none
description: A new Flutter project.
environment: 
  sdk: '>=3.4.1 <4.0.0'

dependencies: 
  cupertino_icons: 1.0.8
  flutter_native_splash: 2.4.1
  get: 4.6.6
  google_fonts: 6.2.1
  path: 1.9.0
  sqflite: 2.3.3+1
  intl: 0.19.0
  flutter: 
    sdk: flutter

dev_dependencies: 
  flutter_lints: 4.0.0
  flutter_test: 
    sdk: flutter

flutter: 
  assets: 
    - assets/
  uses-material-design: true

flutter_assets: 
  assets_path: assets/
  output_path: lib/app/constants/
  filename: assets_constant.dart

