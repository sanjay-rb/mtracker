name: mtracker
version: 1.0.0+1
publish_to: none
description: A new Flutter project.
environment: 
  sdk: '>=3.4.1 <4.0.0'

dependencies: 
  cupertino_icons: ^1.0.6
  flutter_native_splash: ^2.4.1
  get: ^4.6.6
  path: ^1.9.0
  sqflite: ^2.3.3+1
  get_storage: 2.1.1
  flutter: 
    sdk: flutter

dev_dependencies: 
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^3.0.0
  flutter_test: 
    sdk: flutter

flutter_launcher_icons: 
  android: launcher_icon
  image_path: assets/images/icon.png
  ios: true
  min_sdk_android: 21

flutter: 
  assets: 
    - assets/
  uses-material-design: true

